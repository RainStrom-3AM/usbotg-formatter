name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build release APK and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses and install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Generate signing keystore
        run: |
          KEYSTORE="$PWD/release.keystore"
          echo "RELEASE_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=release" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          keytool -genkeypair -v -keystore "$KEYSTORE" -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=USB OTG Formatter,O=Kilo,C=US"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/*.apk
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
